plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tuuuckytv.hcetest'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tuuuckytv.hcetest'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
            debuggable false
        }
    }
}

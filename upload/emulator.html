<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Basement Console</title><style>html,body,#game{width:100%;height:100%;margin:0;background:#17151f;color:#eee;font-family:monospace}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:30px;pointer-events:none}a{color:#c7b6ff}</style></head><body><div id="game"></div><div id="status">Starting the console…</div><script>
const base=new URL('.',location.href).pathname.replace(/\/$/,'');const p=new URLSearchParams(location.hash.slice(1));const id=p.get('rom'),bios=p.get('bios'),core=p.get('core');const allowed=['nes','snes','gb','gba','segaMD','n64','psx','arcade'];
if(!/^[a-f0-9-]{36}$/.test(id||'')||!allowed.includes(core)){document.getElementById('status').textContent='Choose a ROM and a console first.';}else{
window.EJS_player='#game';window.EJS_gameUrl=base+'/api/files/'+id+'/'+encodeURIComponent(p.get('name')||'game.rom');window.EJS_gameName=p.get('name')||'Basement game';window.EJS_gameID=parseInt(id.replaceAll('-','').slice(0,8),16);window.EJS_core=core;window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_startOnLoaded=false;window.EJS_color='#b5a0ef';window.EJS_backgroundColor='#17151f';window.EJS_threads=false;window.EJS_cacheConfig={enabled:false};if(/^[a-f0-9-]{36}$/.test(bios||''))window.EJS_biosUrl=base+'/api/files/'+bios+'/'+encodeURIComponent(p.get('biosName')||'bios.bin');
window.EJS_ready=()=>document.getElementById('status').remove();window.EJS_onGameStart=()=>parent.postMessage({type:'basement-game-started'},location.origin);const script=document.createElement('script');script.src=window.EJS_pathtodata+'loader.js';script.onerror=()=>document.getElementById('status').textContent='The emulator could not load. Check your internet connection and try again.';document.body.appendChild(script);setTimeout(()=>{const s=document.getElementById('status');if(s)s.textContent='The console is still loading. If it does not start, close it and check the ROM, BIOS and connection.';},30000);
}
</script></body></html>
